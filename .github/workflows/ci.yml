name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      POLARS_MAX_THREADS: '4'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: bagelquant-bt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
      - uses: actions/checkout@v5
        with:
          repository: bagelquant/bagelquant-core
          path: bagelquant-core
          ref: a79d526ffbd75dab559f3025469ae58f8ca4ef2c
      - name: Validate package
        working-directory: bagelquant-bt
        run: |
          uv sync --locked --extra optimizer
          uv run --no-sync ruff check .
          uv run --no-sync python -c "from pathlib import Path; Path('.test-tmp').mkdir(parents=True, exist_ok=True)"
          uv run --no-sync python -m pytest --basetemp=.test-tmp/ci -o cache_dir=.test-tmp/cache
