[project]
name = "bagelquant-bt"
version = "0.5.0"
description = "Typed prediction composition, evaluation, and backtesting for BagelQuant"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "BagelQuant" }]
dependencies = [
    "bagelquant-core>=0.6.0,<0.7",
    "numpy>=2.4.0",
    "plotly>=6.0.0",
    "polars>=1.35.0",
    "scipy>=1.16.0",
]

[project.optional-dependencies]
optimizer = [
    "clarabel>=0.11.0",
    "cvxpy>=1.7.0",
    "osqp>=1.0.0",
]

[tool.uv.sources]
bagelquant-core = { path = "../bagelquant-core", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
